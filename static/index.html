<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Assistant</title>
<style>
  :root { --bg:#fff; --fg:#1f1f1f; --muted:#6b6b6b; --card:#f4f4f2; --line:#e3e3df; --accent:#c96442; --accent-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f1e1d; --fg:#ececec; --muted:#9a9a95; --card:#2b2a28; --line:#3a3936; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); font-weight:600; text-align:center; }
  #chat { flex:1; overflow-y:auto; padding:20px 16px; }
  .col { max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .msg { max-width:88%; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--card); padding:10px 14px; border-radius:18px 18px 4px 18px; }
  .bot { align-self:flex-start; }
  .bot.thinking { color:var(--muted); font-style:italic; }
  details { margin-top:8px; font-size:14px; color:var(--muted); }
  summary { cursor:pointer; }
  .src { margin-top:8px; padding:8px 10px; background:var(--card); border-radius:8px; }
  .src b { color:var(--fg); word-break:break-all; font-weight:600; }
  .src pre { margin:6px 0 0; white-space:pre-wrap; font:12px/1.4 ui-monospace,monospace; max-height:140px; overflow:auto; }
  .empty { text-align:center; color:var(--muted); margin-top:20vh; }
  form { padding:12px 16px 18px; }
  .bar { max-width:760px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; border:1px solid var(--line); background:var(--card); border-radius:22px; padding:8px 8px 8px 16px; }
  textarea { flex:1; border:0; outline:0; resize:none; background:transparent; color:var(--fg); font:inherit; max-height:160px; padding:6px 0; }
  button { border:0; border-radius:50%; width:36px; height:36px; background:var(--accent); color:var(--accent-fg); font-size:18px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
<header>RAG Assistant</header>
<div id="chat"><div class="col" id="col"><div class="empty" id="empty">Ask anything about the vLLM codebase and docs.</div></div></div>
<form id="form">
  <div class="bar">
    <textarea id="input" rows="1" placeholder="Ask a question…" autofocus></textarea>
    <button id="send" type="submit" aria-label="Send">&uarr;</button>
  </div>
</form>
<script>
const col = document.getElementById("col"), chat = document.getElementById("chat");
const input = document.getElementById("input"), send = document.getElementById("send");

function add(cls, text) {
  document.getElementById("empty")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;            // textContent (not innerHTML) so nothing can inject HTML
  col.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function addSources(box, sources) {
  if (!sources.length) return;
  const det = document.createElement("details");
  const sum = document.createElement("summary");
  sum.textContent = `Sources (${sources.length})`;
  det.appendChild(sum);
  for (const s of sources) {
    const el = document.createElement("div"); el.className = "src";
    const name = document.createElement("b"); name.textContent = `${s.file_path} [${s.start}:${s.end}]`;
    const pre = document.createElement("pre"); pre.textContent = s.snippet;
    el.append(name, pre); det.appendChild(el);
  }
  box.appendChild(det);
}

async function ask(question) {
  add("user", question);
  const bot = add("bot thinking", "Thinking…");
  send.disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const data = await res.json();
    bot.classList.remove("thinking");
    bot.textContent = data.answer;
    addSources(bot, data.sources);
  } catch (err) {
    bot.textContent = "Error: " + err.message;
  } finally {
    send.disabled = false; input.focus(); chat.scrollTop = chat.scrollHeight;
  }
}

document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || send.disabled) return;
  input.value = ""; input.style.height = "auto";
  ask(q);
});
input.addEventListener("keydown", (e) => {          // Enter sends, Shift+Enter = new line
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
</script>
</body>
</html>
